<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letter Builder - Bahar Web</title>
    <link rel="icon" type="image/x-icon" href="../assets/favicon.ico">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/ribbon.css">
</head>
<body>

    <header id="universal-header"></header>

    <div class="word-workspace">
        
        <div class="word-page">
            
            <div id="bahar-document-header"></div>
            
            <div class="editable-content" contenteditable="true">
                <p>Start typing your official letter here...</p>
                <p>Because the letterhead is outside this box, pressing <b>Ctrl+A</b> will now only select this text!</p>
                <p><br></p>
            </div>
            
            <div class="page-footer">Page 1</div>
        </div>

    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="../js/header.js"></script>
    <script src="../js/pad-header.js"></script>
    <script src="../js/ribbon.js"></script>
    <script src="../js/auto-builder.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const templateName = urlParams.get('template');
            
            if (templateName && typeof window.loadTemplate === 'function') {
                window.loadTemplate(templateName);
            }
        });
    </script>
</body>
</html>
