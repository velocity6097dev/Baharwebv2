<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - Bahar Web</title>
    <link rel="stylesheet" href="../css/global.css">
    <style>
        /* Specific styles for the landing page */
        .hero-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 70vh;
            text-align: center;
            padding: 20px;
        }

        .hero-content {
            background: var(--card-bg);
            padding: 50px;
            border-radius: var(--border-radius);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
            border-top: 4px solid var(--primary-color);
        }

        .hero-content h1 {
            font-size: 2.5rem;
            color: var(--text-main);
            margin-bottom: 15px;
        }

        .hero-content p {
            color: #4b5563;
            font-size: 1.1rem;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .enter-btn {
            display: inline-block;
            background: var(--primary-color);
            color: white;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            text-decoration: none;
            border-radius: var(--border-radius);
            transition: background 0.3s, transform 0.2s;
        }

        .enter-btn:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <!-- We can still include the universal header, or leave it off the landing page. -->
    <header id="universal-header"></header>

    <div class="hero-section">
        <div class="hero-content">
            <h1>Bahar Service Station</h1>
            <p>Welcome to the modernized Bahar Web Portal. Manage your fuel invoices, stamping records, and custom letters all in one synced environment.</p>
            <a href="panel.html" class="enter-btn">Go to Dashboard →</a>
        </div>
    </div>

    <!-- Include the header logic -->
    <script src="../js/header.js"></script>
</body>
</html>
