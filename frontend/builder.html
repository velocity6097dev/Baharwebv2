<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document Builder - Bahar Web</title>
    <link rel="stylesheet" href="css/global.css">
    <style>
        /* Builder Specific Styles */
        .toolbar {
            background: white;
            padding: 10px;
            margin: 0 auto 20px auto;
            max-width: 800px;
            display: flex;
            gap: 10px;
            border-radius: var(--border-radius);
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            position: sticky;
            top: 10px;
            z-index: 100;
        }

        #document-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding-bottom: 50px;
        }

        .page {
            width: var(--page-width-a4);
            height: var(--page-height-a4);
            background: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            padding: 20mm;
            position: relative;
            overflow: hidden; /* Hide overflow to trigger new page logic */
        }

        /* The editable text area inside the page */
        .page-content {
            width: 100%;
            height: 100%;
            outline: none;
            overflow-y: auto;
        }

        .page-number {
            position: absolute;
            bottom: 10mm;
            right: 20mm;
            font-size: 0.8rem;
            color: gray;
        }
    </style>
</head>
<body>

    <header id="universal-header"></header>

    <div class="toolbar">
        <select id="size-select">
            <option value="A4">A4 Size</option>
            <option value="Letter">Letter Size</option>
        </select>
        <button onclick="formatText('justifyLeft')">Left</button>
        <button onclick="formatText('justifyCenter')">Center</button>
        <button onclick="formatText('justifyRight')">Right</button>
        <input type="color" id="color-picker" onchange="changeColor(this.value)" title="Text Color">
        <input type="color" id="bg-picker" onchange="changeBg(this.value)" title="Page Background Fills">
        <button style="margin-left: auto; background: #10b981;" onclick="saveToCloud()">Save to Cloud DB</button>
    </div>

    <div id="document-container">
        <!-- Pages will be generated here -->
    </div>

    <script src="js/header.js"></script>
    <script src="js/builder.js"></script>
</body>
</html>
